[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# App-side programs only. postgresql and redis are intentionally omitted:
# they run as their own containers (mw-opnform db/redis split images).

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=3

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=2

[program:queue-worker]
command=php /usr/share/nginx/html/artisan queue:work --sleep=3 --tries=3
directory=/usr/share/nginx/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=3

[program:scheduler]
command=php /usr/share/nginx/html/artisan schedule:work
directory=/usr/share/nginx/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=3

[program:client]
command=node /client/server/index.mjs
directory=/client
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=NUXT_API_SECRET="sDDDvr4asj0WMEsC4rZHRlhbDs9brTbXXogLLlTh",NUXT_PRIVATE_API_BASE="http://localhost:8080/api",NUXT_PUBLIC_API_BASE="/api",NUXT_PUBLIC_APP_URL="/",NUXT_PUBLIC_ENV="dev"
priority=3
