apiVersion: v1
kind: Namespace
metadata:
  name: saas-bench-slot-4
---
apiVersion: v1
kind: Secret
metadata:
  name: tier4-pg-app
  namespace: saas-bench-slot-4
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tier4-pg
  namespace: saas-bench-slot-4
spec:
  instances: 1
  storage:
    size: 8Gi
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: tier4-pg-app
      postInitSQL:
      - "CREATE ROLE baserow LOGIN PASSWORD 'baserow';"
      - "CREATE DATABASE baserow OWNER baserow;"
      - "CREATE ROLE mattermost LOGIN PASSWORD 'mattermost';"
      - "CREATE DATABASE mattermost OWNER mattermost;"
      - "CREATE ROLE openproject LOGIN PASSWORD 'openproject';"
      - "CREATE DATABASE openproject OWNER openproject;"
      - "CREATE ROLE opnform LOGIN PASSWORD 'opnform';"
      - "CREATE DATABASE opnform OWNER opnform;"
      - "CREATE ROLE pretix LOGIN PASSWORD 'pretix';"
      - "CREATE DATABASE pretix OWNER pretix;"
      - "CREATE ROLE twenty LOGIN PASSWORD 'twenty';"
      - "CREATE DATABASE twenty OWNER twenty;"
      - "CREATE ROLE mediacms LOGIN PASSWORD 'mediacms';"
      - "CREATE DATABASE mediacms OWNER mediacms;"
---
